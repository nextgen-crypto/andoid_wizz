<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Adaptive-icon foreground: transparent layer, mark scaled to 72% so the
    whole silhouette stays inside the 66/108dp safe circle at every mask shape.
  -->
