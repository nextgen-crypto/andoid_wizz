    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <ellipse cx="256" cy="252" rx="235" ry="205" fill="url(#glow)"/>
    <polyline points="112,153 186,343 256,187 326,343 396,153" transform="translate(-7,7)"
      fill="none" stroke="#8B5CF6" stroke-width="74" stroke-linejoin="miter"
      stroke-miterlimit="12" stroke-linecap="butt" opacity="0.9"/>
    <polyline points="112,153 186,343 256,187 326,343 396,153" transform="translate(7,-7)"
      fill="none" stroke="#22D3EE" stroke-width="74" stroke-linejoin="miter"
      stroke-miterlimit="12" stroke-linecap="butt" opacity="0.9"/>
    <polyline points="112,153 186,343 256,187 326,343 396,153"
      fill="none" stroke="#FFFFFF" stroke-width="74" stroke-linejoin="miter"
      stroke-miterlimit="12" stroke-linecap="butt"/>
  </g>
</svg>
